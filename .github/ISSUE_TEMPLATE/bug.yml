name: Bug / validation failure
description: Report a reproducible problem in code, CI, manifests or documentation.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failed and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Sanitized commands, branch/commit and logs needed to reproduce it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link a public workflow run or sanitized output. Never paste credentials/private endpoints.
  - type: checkboxes
    id: security
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, account identifiers and private infrastructure details.
          required: true
