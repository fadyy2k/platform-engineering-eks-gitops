name: Architecture / design change
description: Propose a change to a trust boundary, platform component or operational model.
title: "design: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / failure mode
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed design
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Cost, privilege and operational trade-offs
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback / failure handling
    validations:
      required: true
