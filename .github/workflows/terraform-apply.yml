name: Terraform AWS Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        required: true
        type: choice
        options: [dev, staging, prod]
      confirmation:
        description: Type APPLY to continue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          inputs.confirmation == 'APPLY' &&
          vars.AWS_TERRAFORM_APPLY_ROLE_ARN != '' &&
          vars.TF_STATE_BUCKET != '' &&
          vars.TF_STATE_KMS_KEY_ARN != '' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout protected main branch
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Configure AWS credentials with apply role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: gha-terraform-apply-${{ inputs.environment }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.3"

      - name: Initialize remote backend
        run: |
          terraform -chdir=infra init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-central-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="use_lockfile=true"

      - name: Create reviewed plan
        run: |
          terraform -chdir=infra plan \
            -input=false \
            -lock-timeout=5m \
            -var-file="environments/${{ inputs.environment }}.tfvars.example" \
            -out="${{ inputs.environment }}.tfplan"

      - name: Apply exact plan
        run: terraform -chdir=infra apply -input=false -auto-approve "${{ inputs.environment }}.tfplan"
