name: Terraform AWS Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan ${{ matrix.environment }}
    if: >-
      ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN != '' &&
          vars.TF_STATE_BUCKET != '' &&
          vars.TF_STATE_KMS_KEY_ARN != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    steps:
      - name: Checkout trusted repository code
        uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials with plan role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: gha-terraform-plan-${{ matrix.environment }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.16.3"

      - name: Initialize remote backend
        run: |
          terraform -chdir=infra init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=platform/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-central-1' }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.TF_STATE_KMS_KEY_ARN }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: |
          terraform -chdir=infra plan \
            -input=false \
            -lock-timeout=5m \
            -var-file="environments/${{ matrix.environment }}.tfvars.example"
