apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cost-monitoring-resources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/fadyy2k/platform-engineering-eks-gitops.git
    targetRevision: main
    path: cost/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
