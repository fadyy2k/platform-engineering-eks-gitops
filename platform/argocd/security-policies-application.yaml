apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-security-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/fadyy2k/platform-engineering-eks-gitops.git
    targetRevision: main
    path: security/kyverno/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
